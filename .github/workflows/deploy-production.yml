name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy_production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      # 楽譜カメラアプリを /gakufu/ に同居させる(1枚のHTMLに全部入り)
      - name: Build 楽譜カメラ (gakufu)
        run: |
          python3 apps/score/prototype/build.py
          mkdir -p frontend/dist/gakufu
          cp apps/score/prototype/index.html frontend/dist/gakufu/index.html

      - name: Deploy to Firebase Hosting (production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WATASHIHADARE_QUIZ }}'
          projectId: watashihadare-quiz
          channelId: live
